<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26B386"/>
      <stop offset="0.55" stop-color="#1D9E75"/>
      <stop offset="1" stop-color="#0F6E56"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0B4F3E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle tile -->
  <rect width="256" height="256" rx="60" fill="url(#bg)"/>
  <rect width="256" height="256" rx="60" fill="url(#shine)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="58.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <g transform="translate(12 0)">
  <!-- Mobile: phone body + screen -->
  <g filter="url(#drop)">
    <rect x="62" y="30" width="108" height="196" rx="26" fill="#FFFFFF"/>
  </g>
  <rect x="73" y="50" width="86" height="158" rx="14" fill="#E1F5EE"/>
  <rect x="102" y="38" width="28" height="5" rx="2.5" fill="#D1D5DC"/>

  <!-- Shop: scalloped awning -->
  <path d="M80 62 H152 V82 A12 12 0 0 1 128 82 A12 12 0 0 1 104 82 A12 12 0 0 1 80 82 Z" fill="#1D9E75"/>
  <path d="M104 62 H128 V82 A12 12 0 0 1 104 82 Z" fill="#26B386"/>

  <!-- Cart under the awning (outline style) -->
  <g transform="translate(116 150) scale(0.8) translate(-49 -52)"
     fill="none" stroke="#1D9E75" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 14 H18 L32 58 H82 L90 28 H23"/>
    <path d="M32 58 L29 70 H84"/>
    <circle cx="38" cy="84" r="6"/>
    <circle cx="76" cy="84" r="6"/>
