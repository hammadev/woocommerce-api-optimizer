<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=block');
      .sans { font-family: Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
    </style>

    <!-- Background glows -->
    <radialGradient id="glowR" cx="1150" cy="250" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E1F5EE"/>
      <stop offset="0.55" stop-color="#E1F5EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0" cy="0" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E1F5EE" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot grid, faded toward the left -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1D9E75" fill-opacity="0.22"/>
    </pattern>
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#000"/>
      <stop offset="0.75" stop-color="#FFF"/>
      <stop offset="1" stop-color="#FFF"/>
    </linearGradient>
    <mask id="fade"><rect width="1544" height="500" fill="url(#fadeGrad)"/></mask>

    <!-- Bars -->
    <linearGradient id="barGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26B386"/>
      <stop offset="1" stop-color="#1D9E75"/>
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0F6E56" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#101828" flood-opacity="0.06"/>
    </filter>
    <filter id="pillShadow" x="-30%" y="-50%" width="160%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1D9E75" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1544" height="500" fill="#FFFFFF"/>
  <rect width="1544" height="500" fill="url(#glowR)"/>
  <rect width="1544" height="500" fill="url(#glowL)"/>
  <rect width="1544" height="500" fill="url(#dots)" mask="url(#fade)"/>

  <!-- ===== Left: brand + message ===== -->
  <g transform="translate(96 78)">
    <image href="icon.svg" width="56" height="56"/>
