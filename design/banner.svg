    <text x="74" y="50" class="sans" font-size="17" font-weight="500" fill="#6A7282">WooCommerce API Optimizer</text>
  </g>

  <text x="93" y="250" class="sans" font-size="56" font-weight="800" fill="#101828" letter-spacing="-1.8">Your WooCommerce API</text>
  <text x="93" y="314" class="sans" font-size="56" font-weight="800" fill="#1D9E75" letter-spacing="-1.8">is slowing your app.</text>

  <text x="96" y="378" class="sans" font-size="22" font-weight="400" fill="#4A5565">Filter WooCommerce REST fields with one header.</text>
  <text x="96" y="410" class="sans" font-size="22" font-weight="400" fill="#4A5565">Payloads up to <tspan font-weight="600" fill="#0F6E56">90% smaller</tspan>.</text>

  <!-- ===== Right: before → after card ===== -->
  <g transform="translate(884 86)">
    <rect width="564" height="328" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Window chrome -->
    <circle cx="30" cy="30" r="6" fill="#E5E7EB"/>
    <circle cx="50" cy="30" r="6" fill="#E5E7EB"/>
    <circle cx="70" cy="30" r="6" fill="#E5E7EB"/>
    <text x="96" y="35" class="mono" font-size="15" font-weight="500" fill="#6A7282">GET /wp-json/wc/v3/products</text>
    <line x1="0" y1="58" x2="564" y2="58" stroke="#F3F4F6" stroke-width="1.5"/>

    <!-- Before -->
    <text x="32" y="100" class="sans" font-size="15" font-weight="600" fill="#6A7282" letter-spacing="1.2">DEFAULT RESPONSE</text>
    <text x="532" y="100" class="mono" font-size="17" font-weight="700" fill="#6A7282" text-anchor="end">~18 KB</text>
    <rect x="32" y="114" width="500" height="18" rx="9" fill="#D1D5DC"/>

    <!-- After -->
    <text x="32" y="176" class="sans" font-size="15" font-weight="600" fill="#0F6E56" letter-spacing="1.2">WITH SHOPMOBI</text>
    <text x="532" y="176" class="mono" font-size="17" font-weight="700" fill="#1D9E75" text-anchor="end">~1.2 KB</text>
    <rect x="32" y="190" width="500" height="18" rx="9" fill="#F3F4F6"/>
    <rect x="32" y="190" width="42" height="18" rx="9" fill="url(#barGreen)"/>

    <!-- Header snippet -->
    <rect x="32" y="238" width="500" height="58" rx="12" fill="#E1F5EE"/>
    <text x="54" y="274" class="mono" font-size="18" font-weight="500" fill="#0F6E56">X-Fields:<tspan fill="#101828"> id, name, price, images</tspan></text>
  </g>

  <!-- −90% pill -->
  <g transform="translate(1356 58)" filter="url(#pillShadow)">
    <rect width="118" height="50" rx="25" fill="#1D9E75"/>
    <path d="M26 17 V33 M19 27 L26 34 L33 27" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="33" class="sans" font-size="21" font-weight="800" fill="#FFFFFF" letter-spacing="-0.3">90%</text>
  </g>
</svg>
